<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: file:;">
  <title>LM Watermark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap');

    :root {
      --bg: #0f0f0f;
      --bg2: #181818;
      --bg3: #222222;
      --border: #2a2a2a;
      --border2: #333;
      --text: #f0f0f0;
      --text2: #888;
      --text3: #555;
      --accent: #c8a96e;
      --accent2: #a08550;
      --success: #4caf7d;
      --danger: #e05c5c;
      --white-badge: #f0ede6;
      --black-badge: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* TITLEBAR */
    .titlebar {
      height: 42px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      -webkit-app-region: drag;
      user-select: none;
      flex-shrink: 0;
    }
    .titlebar .logo {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .titlebar .subtitle {
      margin-left: 12px;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 1px;
    }

    /* LAYOUT */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s;
      text-align: left;
    }
    .btn:hover { border-color: var(--accent2); color: var(--accent); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn.primary {
      background: var(--accent);
      color: #0f0f0f;
      border-color: var(--accent);
      font-weight: 500;
      justify-content: center;
    }
    .btn.primary:hover { background: #d4b87a; border-color: #d4b87a; color: #0f0f0f; }
    .btn.success {
      background: transparent;
      color: var(--success);
      border-color: #2a5a3a;
    }
    .btn.success:hover { background: #1a3a2a; }
    .btn .icon { width: 14px; text-align: center; flex-shrink: 0; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; color: var(--text2); }
    select {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      width: 100%;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent2); }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type=range] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      background: var(--border2);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .slider-val {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      min-width: 36px;
      text-align: right;
    }

    .output-path {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      word-break: break-all;
      min-height: 32px;
    }

    /* DIVIDER */
    .divider { height: 1px; background: var(--border); margin: 0 -16px; }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOOLBAR */
    .toolbar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg2);
    }
    .toolbar .count {
      font-size: 11px;
      color: var(--text3);
      margin-left: auto;
      font-family: 'DM Mono', monospace;
    }
    .btn.small {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
    }

    /* DROPZONE */
    .dropzone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--border2);
      margin: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text3);
      gap: 8px;
    }
    .dropzone:hover, .dropzone.active {
      border-color: var(--accent2);
      background: rgba(200, 169, 110, 0.03);
      color: var(--text2);
    }
    .dropzone .drop-icon { font-size: 32px; opacity: 0.4; }
    .dropzone p { font-size: 14px; }
    .dropzone span { font-size: 11px; }

    /* GALLERY */
    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .photo-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.12s;
      position: relative;
    }
    .photo-card:hover { border-color: var(--border2); }
    .photo-card.done { border-color: #2a5a3a; }
    .photo-card.error { border-color: var(--danger); }

    .photo-thumb {
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover;
      display: block;
      background: var(--bg3);
    }

    .photo-info {
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .photo-name {
      flex: 1;
      font-size: 10px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge.pending { background: var(--bg3); color: var(--text3); border: 1px solid var(--border2); }
    .badge.processing { background: rgba(200,169,110,0.15); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
    .badge.white-wm { background: var(--white-badge); color: #333; }
    .badge.black-wm { background: var(--black-badge); color: #ccc; border: 1px solid #444; }
    .badge.error-badge { background: rgba(224,92,92,0.15); color: var(--danger); border: 1px solid rgba(224,92,92,0.3); }

    .photo-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: #aaa;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .photo-card:hover .photo-remove { display: flex; }

    /* PROGRESS BAR */
    .progress-bar-wrap {
      height: 2px;
      background: var(--border);
      position: relative;
      flex-shrink: 0;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
      width: 0%;
    }

    /* STATUSBAR */
    .statusbar {
      padding: 6px 16px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .statusbar .msg {
      font-size: 11px;
      color: var(--text2);
      font-family: 'DM Mono', monospace;
    }
    .statusbar .stats {
      margin-left: auto;
      display: flex;
      gap: 16px;
    }
    .stat { font-size: 10px; font-family: 'DM Mono', monospace; }
    .stat span { color: var(--accent); }

    /* WM PATH INDICATOR */
    .wm-status {
      display: flex;
      gap: 6px;
    }
    .wm-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .wm-dot.ok { background: var(--success); }
    .wm-dot.err { background: var(--danger); }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>

<div class="titlebar">
  <span class="logo">LM Watermark</span>
  <span class="subtitle">— Luc Moreno Photographe</span>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div>
      <div class="section-title">Importer</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn" id="btn-files">
          <span class="icon">📷</span> Sélectionner des photos
        </button>
        <button class="btn" id="btn-folder">
          <span class="icon">📁</span> Importer un dossier
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-title">Filigranes</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn" id="btn-wm-white" style="gap:8px;">
          <div class="wm-dot" id="dot-white" style="flex-shrink:0;margin:0;"></div>
          <div style="text-align:left;">
            <div style="font-size:11px;">Filigrane blanc</div>
            <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;" id="wm-white-name">cliquer pour choisir</div>
          </div>
        </button>
        <button class="btn" id="btn-wm-black" style="gap:8px;">
          <div class="wm-dot" id="dot-black" style="flex-shrink:0;margin:0;"></div>
          <div style="text-align:left;">
            <div style="font-size:11px;">Filigrane noir</div>
            <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;" id="wm-black-name">cliquer pour choisir</div>
          </div>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-title">Réglages</div>
      <div style="display:flex;flex-direction:column;gap:12px;">

        <div class="field">
          <label>Position</label>
          <select id="position">
            <option value="bottom-right">Bas droite</option>
            <option value="bottom-left">Bas gauche</option>
            <option value="bottom-center">Bas centre</option>
            <option value="top-right">Haut droite</option>
            <option value="top-left">Haut gauche</option>
            <option value="top-center">Haut centre</option>
            <option value="center">Centre</option>
          </select>
        </div>

        <div class="field">
          <label>Taille du filigrane</label>
          <div class="slider-row">
            <input type="range" id="size" min="3" max="50" value="20">
            <span class="slider-val" id="size-val">20%</span>
          </div>
        </div>

        <div class="field">
          <label>Opacité</label>
          <div class="slider-row">
            <input type="range" id="opacity" min="10" max="100" value="85">
            <span class="slider-val" id="opacity-val">85%</span>
          </div>
        </div>

        <div class="field">
          <label>Marge (px)</label>
          <div class="slider-row">
            <input type="range" id="margin" min="0" max="150" value="30">
            <span class="slider-val" id="margin-val">30px</span>
          </div>
        </div>

        <div class="field">
          <label>Format de sortie</label>
          <select id="output-format">
            <option value="same">Même format que source</option>
            <option value="jpg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select>
        </div>

        <div class="field">
          <label>Qualité JPEG</label>
          <div class="slider-row">
            <input type="range" id="quality" min="60" max="100" value="92">
            <span class="slider-val" id="quality-val">92</span>
          </div>
        </div>

        <div class="field">
          <label>Suffixe fichier sortie</label>
          <input type="text" id="suffix" value="_wm" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'DM Mono',monospace;font-size:12px;width:100%;">
        </div>

      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-title">Dossier de sortie</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn" id="btn-output-dir">
          <span class="icon">📂</span> Choisir le dossier
        </button>
        <div class="output-path" id="output-path-display">Même dossier que source</div>
      </div>
    </div>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;">
      <button class="btn primary" id="btn-process" disabled>
        ▶ Appliquer les filigranes
      </button>
      <button class="btn success" id="btn-open-output" disabled>
        ↗ Ouvrir le dossier de sortie
      </button>
    </div>

  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <button class="btn small" id="btn-clear" disabled>✕ Tout effacer</button>
      <button class="btn small" id="btn-remove-done">✓ Retirer traités</button>
      <span class="count" id="photo-count">0 photo(s)</span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="drop-area" class="dropzone">
      <div class="drop-icon">🖼</div>
      <p>Glisse tes photos ici</p>
      <span>ou utilise le bouton pour sélectionner</span>
    </div>

    <div class="gallery-container" id="gallery-container" style="display:none;">
      <div class="gallery" id="gallery"></div>
    </div>

    <div class="statusbar">
      <span class="msg" id="status-msg">Prêt</span>
      <div class="stats">
        <div class="stat">Traitées: <span id="stat-done">0</span></div>
        <div class="stat">Blanc: <span id="stat-white">0</span></div>
        <div class="stat">Noir: <span id="stat-black">0</span></div>
        <div class="stat">Erreurs: <span id="stat-errors">0</span></div>
      </div>
    </div>

  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
